# Broker of docker/kafka-ssl (specs/ssl-fail-fast.md). Started directly, bypassing the
# image's env-based configure script (it requires JKS key stores for SSL listeners).
node.id=1
process.roles=broker,controller
controller.quorum.voters=1@localhost:9193
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT
listeners=PLAINTEXT://:9192,CONTROLLER://:9193,SSL://:9194,SASL_PLAINTEXT://:9195
# 127.0.0.1, not localhost: on Windows localhost resolves to ::1 first
advertised.listeners=PLAINTEXT://127.0.0.1:9192,SSL://127.0.0.1:9194,SASL_PLAINTEXT://127.0.0.1:9195
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SSL:SSL,SASL_PLAINTEXT:SASL_PLAINTEXT
log.dirs=/tmp/kraft-logs
num.partitions=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1

# TLS: broker certificate CN=kafka without SAN, PEM key store and trust store
ssl.keystore.type=PEM
ssl.keystore.location=/etc/kafka/certs/broker-keystore.pem
ssl.truststore.type=PEM
ssl.truststore.location=/etc/kafka/certs/ca-cert.pem
ssl.client.auth=required

# SASL PLAIN: user test / password test-secret
sasl.enabled.mechanisms=PLAIN
listener.name.sasl_plaintext.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="test" password="test-secret" user_test="test-secret";
