# Single-node Kafka (KRaft) test bench for share groups (KIP-932, Queues for Kafka).
# Share groups are GA since Apache Kafka 4.2; 4.2.x is the minimum version supported
# by the component, so the bench pins it on purpose.
services:
  kafka:
    image: apache/kafka:4.2.2
    container_name: kafka-share
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 127.0.0.1, not localhost: on Windows localhost resolves to ::1 first, and
      # Docker Desktop does not answer on it (connect hangs ~21 s)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      # Shorter record lock than the 30 s default, to keep the lock-expiry test (AC-9) fast
      KAFKA_GROUP_SHARE_RECORD_LOCK_DURATION_MS: 15000
